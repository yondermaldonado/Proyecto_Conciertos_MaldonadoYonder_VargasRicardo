<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Conciertos Conectados</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <div id="login-block" class="modal active" style="background:#1a1a2e;">
        <div class="modal-content">
            <h3 style="text-align:center; margin-bottom:20px;">Acceso Administrativo</h3>
            <form id="form-login">
                <div class="form-group"><label>Email</label><input type="email" id="log-email" required value="admin@mail.com"></div>
                <div class="form-group"><label>Contraseña</label><input type="password" id="log-pass" required value="123456"></div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Ingresar</button>
            </form>
        </div>
    </div>

    <div id="admin-dashboard" style="display:none;">
        <header>
            <div class="logo">Panel<span>Admin</span></div>
            <nav id="admin-nav">
                <a data-target="mod-categorias" class="active">Categorías</a>
                <a data-target="mod-eventos">Eventos</a>
                <a data-target="mod-ventas">Ventas</a>
                <a id="btn-logout" style="color:var(--primary-color)">Salir</a>
            </nav>
        </header>

        <main class="container">
            <section id="mod-categorias" class="admin-section">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h2>Módulo Categorías</h2>
                    <button class="btn btn-primary" id="btn-add-cat">Agregar Categoría</button>
                </div>
                <table id="table-categories">
                    <thead><tr><th>Nombre</th><th>Descripción</th><th>Acciones</th></tr></thead>
                    <tbody></tbody>
                </table>
            </section>

            <section id="mod-eventos" class="admin-section" style="display:none;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h2>Módulo Eventos</h2>
                    <button class="btn btn-primary" id="btn-add-ev">Agregar Evento</button>
                </div>
                <table id="table-events">
                    <thead><tr><th>Código</th><th>Nombre</th><th>Ciudad</th><th>Precio</th><th>Acciones</th></tr></thead>
                    <tbody></tbody>
                </table>
            </section>

            <section id="mod-ventas" class="admin-section" style="display:none;">
                <h2>Historial de Ventas</h2>
                <table id="table-sales">
                    <thead><tr><th>Fecha</th><th>Cliente</th><th>Ciudad</th><th>Total</th><th>Detalles</th></tr></thead>
                    <tbody></tbody>
                </table>
            </section>
        </main>
    </div>

    <div id="modal-cat" class="modal">
        <div class="modal-content">
            <span class="close-modal" class="close-generic">&times;</span>
            <h3 id="cat-modal-title">Nueva Categoría</h3>
            <form id="form-category">
                <input type="hidden" id="cat-id">
                <div class="form-group"><label>Nombre</label><input type="text" id="cat-name" required></div>
                <div class="form-group"><label>Descripción</label><textarea id="cat-desc" required></textarea></div>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </form>
        </div>
    </div>

    <div id="modal-ev" class="modal">
        <div class="modal-content">
            <span class="close-modal" class="close-generic">&times;</span>
            <h3 id="ev-modal-title">Gestionar Evento</h3>
            <form id="form-event">
                <div class="form-group"><label>Código</label><input type="text" id="ev-code" required></div>
                <div class="form-group"><label>Nombre</label><input type="text" id="ev-name" required></div>
                <div class="form-group"><label>Categoría</label><select id="ev-cat" required></select></div>
                <div class="form-group"><label>Precio (COP)</label><input type="number" id="ev-price" required></div>
                <div class="form-group"><label>Fecha</label><input type="date" id="ev-date" required></div>
                <div class="form-group"><label>Hora</label><input type="time" id="ev-time" required></div>
                <div class="form-group"><label>Ciudad</label>
                    <select id="ev-city" required>
                        <option value="Barranquilla">Barranquilla</option>
                        <option value="Bogotá">Bogotá</option>
                        <option value="Bucaramanga">Bucaramanga</option>
                        <option value="Medellín">Medellín</option>
                    </select>
                </div>
                <div class="form-group"><label>URL Imagen</label><input type="url" id="ev-img" required></div>
                <div class="form-group"><label>Descripción</label><textarea id="ev-desc" required></textarea></div>
                <button type="submit" class="btn btn-primary">Guardar Evento</button>
            </form>
        </div>
    </div>

    <script src="js/data-seed.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
